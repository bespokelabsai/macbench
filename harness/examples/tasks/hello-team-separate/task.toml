schema_version = "1.4"

[metadata]
description = "hello-team with the verifier in its own sandbox, scoring the team's exported repo bundle and board log."
tags = ["multi-agent", "toy"]

# The verifier only reads the exported bundle and board log.
[verifier]
timeout_sec = 120.0
environment_mode = "separate"
network_mode = "no-network"

# Built through the sandbox SDK from tests/Dockerfile.
[verifier.environment]
build_timeout_sec = 600.0

# Agents reach only the hub (board, proxy, git) while they work.
[agent]
timeout_sec = 1200.0
network_mode = "no-network"

# Open at start so the hub runtime and the agents' CLIs can install.
[environment]
build_timeout_sec = 1200.0
network_mode = "public"

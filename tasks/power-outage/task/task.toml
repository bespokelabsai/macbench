schema_version = "1.3"
# Captured after the agents end, before grading: the team repository with the controllers and notes.
artifacts = ["/app"]

[task]
name = "bespokelabsai/power-outage"
description = "Power Outage: restore a national grid after a total blackout by writing its 16 area controllers as a team"
authors = [{ name = "Bespoke Labs" }]
keywords = ["multi-agent", "power-systems", "grid-restoration", "black-start", "long-horizon", "decentralised-control"]

[metadata]
author_name = "Bespoke Labs"
task_id = "power-outage"
display_title = "POWER OUTAGE: black-start restoration of a national grid"
category = "engineering"
difficulty = "hard"
language = "python"

[agent]
# 4 hours (instruction.md and MANUAL.md say so).
timeout_sec = 14400.0
# Agents reach only the hub (board, operations office, team repository). A cloud sandbox backend enforces this; on
# Docker the harness cannot, and the agents have internet access (README.md).
network_mode = "no-network"
# Agents work as an unprivileged user; the hub and the verifier run as root.
user = "agent"

[verifier]
# The shared verifier, on the hub: 48 hidden scenarios, about 2.5 CPU-minutes each with 16 controller processes,
# half as many at once as the hub has CPUs (tests/verify.py). Graded marks during the run (the harness's grade_at)
# play 8 of them, so each takes minutes. After the final grading, tests/test.sh grades every earlier mark again on all
# 48 from the solution it saved (about 30 minutes each); BLACKSTART_FULL_MARKS_S caps that at 3 hours. The timeout is
# 7800 s for the final grading plus that cap and a margin.
timeout_sec = 18900.0
network_mode = "no-network"
env = { BLACKSTART_VERIFY_SCENARIOS = "48", BLACKSTART_FULL_MARKS_S = "10800", BLACKSTART_MARK_SCENARIOS = "8" }

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
# Each agent sandbox and the hub while agents work. The hub also runs the operations office's drills (3 at once,
# about one CPU each); grading grows it (hub_cpus, hub_memory_mb in README.md).
cpus = 4
memory_mb = 8192
storage_mb = 10240

schema_version = "1.3"
# Captured after the agents end: the agents' files, for the record. The grade does not read them.
artifacts = ["/app"]

[task]
name = "bespokelabsai/mindustry"
description = "Mindustry: many fronts. A team plays one live game of Mindustry for 4 hours and is scored on what its factories deliver to the core"
authors = [{ name = "Bespoke Labs" }]
keywords = ["multi-agent", "mindustry", "real-time", "long-horizon"]

[metadata]
author_name = "Bespoke Labs"
task_id = "mindustry"
display_title = "Mindustry: many fronts"
category = "games"
difficulty = "hard"
language = "python"

[agent]
user = "agent"
# 4 hours.
timeout_sec = 14400.0
network_mode = "no-network"

[verifier]
# Reads the game's grading state; takes under a second.
timeout_sec = 300.0
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480

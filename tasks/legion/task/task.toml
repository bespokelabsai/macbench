schema_version = "1.3"
# Captured after the agents end, before grading: the team repo with the AI, AI.md and notes.
artifacts = ["/app"]

[task]
name = "bespokelabsai/legion"
description = "Write a game AI for 0 A.D. that beats Petra, the game's built-in AI, on hidden 1v1 conquest matches"
authors = [{ name = "Bespoke Labs" }]
keywords = ["multi-agent", "rts", "0ad", "game-playing", "long-horizon"]

[metadata]
author_name = "Bespoke Labs"
task_id = "legion"
display_title = "0 A.D.: write a game AI that beats Petra"
category = "game-ai"
difficulty = "hard"
language = "javascript"

[agent]
# 4 hours (instruction.md says so).
timeout_sec = 14400.0
# Agents reach only the hub. A cloud sandbox backend enforces this; on Docker the harness cannot, and the agents have
# internet access (README.md).
network_mode = "no-network"
# Agents work as an unprivileged user; the hub and the verifier run as root.
user = "agent"

[verifier]
env = { LEGION_VERIFY_MATCHES = "120", LEGION_VERIFY_JOBS = "6", LEGION_FULL_MARKS_S = "16200", LEGION_MARK_MATCHES = "24" }
# Team runs grade on the hub (the harness's shared verifier, which graded marks need): 120 of the 240 hidden matches
# against Petra (tests/hidden/petra.zip), 6 at once on an 8-CPU hub, 24 at the marks before the last. A match is at most
# 600 s on one CPU, and every match the AI does not lose is played twice. After the final grading, tests/test.sh
# grades every earlier mark again on 120 matches from the AI it saved (30 to 60 minutes each); LEGION_FULL_MARKS_S
# caps that at 4.5 hours. The timeout is 8100 s for the final grading plus that cap and a margin.
timeout_sec = 24600.0
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
# Each agent sandbox: room for a few local sparring games (one CPU and up to ~650 MB each) next to the agent.
# The hub has the same size while the agents work and plays the practice office's games (LEGION_PRACTICE_SLOTS).
cpus = 4
memory_mb = 8192
storage_mb = 30720
